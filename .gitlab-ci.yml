# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - test
  - secret-detection
  - policy
  - sync

variables:


  # Ziel auf Codeberg per SSH (kein oauth2, kein whitespace-key-problem)

variables:
  SECRET_DETECTION_ENABLED: "true"
  TARGET_REPO_URL: "${CODEBERG_TARGET_REPO_SSH}"
  TARGET_BRANCH: "${CODEBERG_TARGET_BRANCH:-main}"
  SYNC_CLASSIFICATIONS: "public"

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection

# Policy:
# - jede *.md MUSS YAML-Frontmatter haben und darin classification:
# - classification muss in erlaubter Liste sein
# - strictly-confidential wird geblockt
classification_policy:
  stage: test
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - |
      set -eu
      cd "$CI_PROJECT_DIR"

      allowed="public internal confidential strictly-confidential"
      fail=0

      # Newline-basierte Dateiliste
      find . -type f -name "*.md" -print | while IFS= read -r f; do
        cls="$(awk '
          BEGIN{fm=0}
          NR==1 && $0 ~ /^---[[:space:]]*$/ {fm=1; next}
          fm==1 && $0 ~ /^---[[:space:]]*$/ {exit}
          fm==1 && $0 ~ /^[[:space:]]*classification:[[:space:]]*/ {
            sub(/^[[:space:]]*classification:[[:space:]]*/, "", $0)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            print $0
            exit
          }
        ' "$f")"

        if [ -z "${cls:-}" ]; then
          echo "POLICY FAIL: missing classification in YAML frontmatter: $f"
          fail=1
          continue
        fi

        case " $allowed " in
          *" $cls "*) : ;;
          *)
            echo "POLICY FAIL: invalid classification '$cls' in $f (allowed: $allowed)"
            fail=1
            ;;
        esac

        if [ "$cls" = "strictly-confidential" ]; then
          echo "POLICY FAIL: strictly-confidential must not be pushed: $f"
          fail=1
        fi
      done

      # busybox: weil while in Subshell laufen kann, fail robust prüfen über Exit-Code:
      # Wenn du wirklich 100% sicher sein willst, sag Bescheid, dann machen wir fail-file statt Variable.
      if [ "$fail" -ne 0 ]; then
        echo "Classification policy check failed."
        exit 1
      fi

sync_public_only:
  stage: sync
  image:
    name: alpine/git:2.45.2
    entrypoint: [""]
  needs: ["classification_policy"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apk add --no-cache openssh-client
    - git config --global user.name "ci-sync"
    - git config --global user.email "ci-sync@invalid"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$CODEBERG_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H codeberg.org >> ~/.ssh/known_hosts
  script:
    - |
      set -eu

      # Whitelist (space-separated), z.B.: "public"
      ALLOWED_CLASSIFICATIONS="${SYNC_CLASSIFICATIONS:-public}"

      mkdir -p /tmp/sync
      cd /tmp/sync
      cp -a "$CI_PROJECT_DIR/." ./src
      rm -rf ./src/.git

      cd ./src

      # --- 1) allowed Markdown bestimmen (Whitelist)
      allowed_list="$(mktemp)"
      allowed_txt="$(mktemp)"
      find . -type f -name "*.md" -print | while IFS= read -r f; do
        cls="$(awk '
          BEGIN{fm=0}
          NR==1 && $0 ~ /^---[[:space:]]*$/ {fm=1; next}
          fm==1 && $0 ~ /^---[[:space:]]*$/ {exit}
          fm==1 && $0 ~ /^[[:space:]]*classification:[[:space:]]*/ {
            sub(/^[[:space:]]*classification:[[:space:]]*/, "", $0)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            print $0
            exit
          }
        ' "$f")"

        case " $ALLOWED_CLASSIFICATIONS " in
          *" $cls "*)
            printf "%s\n" "$f" >> "$allowed_list"
            printf "%s\n" "$f" >> "$allowed_txt"
            ;;
        esac
      done

      # --- 2) Referenzen aus allowed Notes extrahieren
      refs="$(mktemp)"
      while IFS= read -r md; do
        [ -n "$md" ] || continue
        awk '
          {
            line=$0
            while (match(line, /!?\[\[[^][]+\]\]/)) {
              token=substr(line, RSTART, RLENGTH)
              inner=token
              sub(/^!?\[\[/,"",inner)
              sub(/\]\]$/,"",inner)
              split(inner, a, "|")
              print a[1]
              line=substr(line, RSTART+RLENGTH)
            }

            line=$0
            while (match(line, /\]\([^)]+\)/)) {
              token=substr(line, RSTART, RLENGTH)
              inner=token
              sub(/^\]\(/,"",inner)
              sub(/\)$/,"",inner)
              print inner
              line=substr(line, RSTART+RLENGTH)
            }
          }
        ' "$md" >> "$refs"
      done < "$allowed_list"

      # --- 3) Keep-Listen
      keep_files="$(mktemp)"
      keep_dirs="$(mktemp)"
      cat "$allowed_list" >> "$keep_files"

      add_if_exists() {
        p="$1"
        if [ -f "$p" ]; then
          printf "%s\n" "$p" >> "$keep_files"
          dirname "$p" >> "$keep_dirs"
        fi
      }

      while IFS= read -r r; do
        [ -n "$r" ] || continue
        r="$(printf "%s" "$r" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

        printf "%s" "$r" | grep -qiE '^(https?|mailto|obsidian|file):' && continue

        r="${r%%\#*}"
        r="${r%%\?*}"
        [ -n "$r" ] || continue
        r="${r#./}"

        if printf "%s" "$r" | grep -q '/'; then
          if [ -f "$r" ]; then
            add_if_exists "$r"
          else
            base="${r%.*}"
            if [ "$base" = "$r" ]; then
              find . -type f -path "./$r.*" -print 2>/dev/null | while IFS= read -r p; do add_if_exists "$p"; done
            fi
          fi
        else
          name="$r"
          if printf "%s" "$name" | grep -q '\.'; then
            find . -type f -name "$name" -print | while IFS= read -r p; do add_if_exists "$p"; done
          else
            find . -type f -name "${name}.*" -print | while IFS= read -r p; do add_if_exists "$p"; done
          fi
        fi
      done < "$refs"

      # --- 4) not-allowed md bestimmen (für gleichnamige Ordner-Löschung)
      notallowed_md="$(mktemp)"
      find . -type f -name "*.md" -print | while IFS= read -r f; do
        grep -Fxq "$f" "$allowed_txt" || printf "%s\n" "$f" >> "$notallowed_md"
      done

      sort -u -o "$keep_files" "$keep_files"
      sort -u -o "$keep_dirs" "$keep_dirs"

      # --- 5) Gefilterten Tree bauen
      mkdir -p /tmp/sync/out
      rm -rf /tmp/sync/out/*

      while IFS= read -r d; do
        [ -n "$d" ] || continue
        mkdir -p "/tmp/sync/out/$d"
      done < "$keep_dirs"

      while IFS= read -r f; do
        [ -n "$f" ] || continue
        mkdir -p "/tmp/sync/out/$(dirname "$f")"
        cp -a -- "$f" "/tmp/sync/out/$f"
      done < "$keep_files"

      # --- 6) gleichnamige Ordner von nicht-allowed Notes entfernen
      if [ -s "$notallowed_md" ]; then
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          dir="$(dirname "$f")"
          base="$(basename "$f" .md)"
          candidate="/tmp/sync/out/$dir/$base"
          [ -d "$candidate" ] && rm -rf -- "$candidate"
        done < "$notallowed_md"
      fi

      find /tmp/sync/out -type d -empty -delete

      # --- Push
      cd /tmp/sync

      git clone "$TARGET_REPO_URL" target
      find target -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
      cp -a /tmp/sync/out/. target/

      cd target
      git add -A
      if git diff --cached --quiet; then
        echo "No changes to push."
        exit 0
      fi
      SRC_SUBJ="$(git -C "$CI_PROJECT_DIR" log -1 --pretty=%s)"
      git commit -m "${SRC_SUBJ} (sync ${CI_COMMIT_SHORT_SHA})"
      git push origin "HEAD:${TARGET_BRANCH}"
